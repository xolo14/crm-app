plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.syncpedia.crm'
    compileSdk 36

    defaultConfig {
        applicationId "com.syncpedia.crm"
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName "1.0.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH") ?: "release.jks"
            def ks = file(ksPath)
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv("KEYSTORE_PASS") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASS") ?: ""
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            // Play rejects debug-signed release builds — never fall back silently.
            // See the taskGraph check below, which fails the build loudly instead.
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "CRM Syncpedia-${variant.versionName}.apk"
        }
    }
}

// Fail the build loudly if a release artifact is requested without a real release
// keystore configured — Play Console rejects debug-signed release builds, and silently
// falling back to the debug keystore (the old behavior) produces an unshippable .aab/.apk
// without any warning. Only gates actual release assemble/bundle/sign tasks, not every task.
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { t ->
        def n = t.name
        n.contains("Release") && (n.startsWith("assemble") || n.startsWith("bundle") || n.startsWith("package") || n.startsWith("sign"))
    }
    if (buildingRelease) {
        def ksPath = System.getenv("KEYSTORE_PATH") ?: "release.jks"
        def ks = file(ksPath)
        if (!ks.exists()) {
            throw new GradleException(
                "Release signing is not configured: '${ksPath}' not found. " +
                "Set KEYSTORE_PATH/KEYSTORE_PASS/KEY_ALIAS/KEY_PASS env vars (or place release.jks " +
                "at the repo root) before building a release artifact. Play Console rejects " +
                "debug-signed .aab/.apk uploads — see CHANGELOG-AUDIT.md."
            )
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // WorkManager (background sync retry)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Room (call records + sync status)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Location
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    // Google Sign-In (ID token sent to auth.php?action=google_login)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Encrypted session storage
    implementation 'androidx.security:security-crypto:1.0.0'

    // UI
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Charts (for Analysis tab)
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'
}
